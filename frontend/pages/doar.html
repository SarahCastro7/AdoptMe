<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoptMe | Doar animal</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
</head>

<body data-page="doar" data-root="../">
    <main>
        <h1 class="titulo">Doar animal</h1>
        <form id="form" class="card">
            <div class="form-card">
                <label class="foto-upload" id="preview">
                    <span>📷<br>foto do animal<br><small>clique para escolher</small></span>
                    <input type="file" id="foto" accept="image/*" hidden>
                </label>
                <div class="campos">
                    <div class="full"><label for="nome">Nome</label><input id="nome" required minlength="3"
                            placeholder="Ex.: Lilica"></div>
                    <div><label for="idade">Idade (anos)</label><input id="idade" type="number" min="0" required></div>
                    <div><label for="genero">Gênero</label>
                        <select id="genero" required>
                            <option value="">Selecione</option>
                            <option value="fem">Fêmea</option>
                            <option value="masc">Macho</option>
                        </select>
                    </div>
                    <div class="full"><label for="especie">Espécie</label><input id="especie" required
                            placeholder="Ex.: cachorro, gato, coelho..."></div>
                </div>
            </div>
            <div class="acoes">
                <a class="btn sec" href="animais.html">Cancelar</a>
                <button class="btn" type="submit">Salvar</button>
            </div>
            <p class="msg" id="msg"></p>
        </form>
    </main>
    <script src="../js/app.js"></script>
    <script>
        let fotoData = null;
        const $ = id => document.getElementById(id);

        $('foto').addEventListener('change', e => {
            const f = e.target.files[0];
            if (!f) return;
            if (f.size > 2 * 1024 * 1024) { alert('Escolha uma imagem de até 2 MB.'); e.target.value = ''; return; }
            const r = new FileReader();
            r.onload = () => { fotoData = r.result; $('preview').innerHTML = `<img src="${fotoData}" alt="prévia">`; };
            r.readAsDataURL(f);
        });

        $('form').addEventListener('submit', async e => {
            e.preventDefault();
            const msg = $('msg');
            const body = { nome: $('nome').value, idade: $('idade').value, genero: $('genero').value, especie: $('especie').value, foto: fotoData };
            try {
                const res = await fetch(`${API}/animais`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.erro);
                msg.className = 'msg ok'; msg.textContent = `${data.nome} foi cadastrado! Redirecionando...`;
                setTimeout(() => location.href = 'animais.html', 1200);
            } catch (err) {
                msg.className = 'msg erro';
                msg.textContent = err.message === 'Failed to fetch' ? 'Servidor fora do ar. Rode o backend (npm run dev).' : err.message;
            }
        });
    </script>
</body>

</html>
