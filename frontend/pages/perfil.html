<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdoptMe | Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css">
</head>

<body data-page="perfil" data-root="../">
  <main>
    <h1 class="titulo">Meu perfil</h1>
    <div class="perfil">
      <aside class="card user">
        <div class="foto">👤</div>
        <small>nome de usuário</small><b>user10</b>
        <small>atividade</small><b><span class="on">● ativo</span> | offline</b>
        <small>email</small><b>user10@gmail.com</b>
        <a class="link" href="#">formatar senha?</a>
      </aside>
      <section>
        <img class="img-box" src="../images/download.jpg" alt="Animal adotado">
        <div class="stats">
          <div class="card stat"><small>desde</small><strong>2021</strong></div>
          <div class="card stat"><small>doações realizadas</small><strong>+2 mil</strong></div>
        </div>
      </section>
    </div>
  </main>
  <script src="../js/app.js"></script>
</body>

</html>
